<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sua Loja de Vape</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-destaque: #00ff88;
            --cor-fundo: #000000;
            --cor-card: #141414;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cor-fundo);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: var(--cor-card);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(0, 255, 136, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
        }

        h2 { margin-bottom: 30px; font-weight: 800; }

        .input-group { text-align: left; margin-bottom: 20px; }

        label { display: block; margin-bottom: 8px; color: #888; font-size: 0.8rem; }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--cor-destaque); }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--cor-destaque);
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-login:hover { transform: scale(1.02); background: #00cc6e; }

        .link-voltar {
            display: block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Acessar Loja</h2>
    <form id="loginForm">
        <div class="input-group">
            <label>E-mail ou Usuário</label>
            <input type="email" placeholder="seu@email.com" required>
        </div>
        <div class="input-group">
            <label>Senha</label>
            <input type="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">ENTRAR</button>
    </form>
    <a href="index.html" class="link-voltar">Voltar para a vitrine</a>
</div>

<script>
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = e.target.querySelector('input[type="email"]').value.trim().toLowerCase();
        const senha = e.target.querySelector('input[type="password"]').value;

        // Tenta buscar o usuário na memória do navegador
        const usuarioSalvo = JSON.parse(localStorage.getItem('usuario_' + email));

        if (usuarioSalvo && usuarioSalvo.senha === senha) {
            localStorage.setItem('usuarioLogado', 'true');
            localStorage.setItem('emailLogado', email); // Salva quem logou
            alert('Bem-vindo de volta!');
            window.location.href = 'index.html';
        } else {
            // Se não encontrar, vamos oferecer para "Cadastrar" como se fosse o primeiro acesso
            const confirmar = confirm('Usuário não encontrado. Deseja criar uma conta com este e-mail e senha?');
            if (confirmar) {
                const novoUsuario = { email: email, senha: senha };
                localStorage.setItem('usuario_' + email, JSON.stringify(novoUsuario));
                alert('Conta criada com sucesso! Agora você pode comprar.');
                
                // Loga automaticamente após cadastrar
                localStorage.setItem('usuarioLogado', 'true');
                localStorage.setItem('emailLogado', email);
                window.location.href = 'index.html';
            }
        }
    });
</script>

</body>
</html>
