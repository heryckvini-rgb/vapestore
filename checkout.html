<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Checkout | Pagamento</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --cor-destaque: #00ff88; --cor-fundo: #000; --cor-card: #141414; }
        body { font-family: 'Inter', sans-serif; background: var(--cor-fundo); color: white; display: flex; justify-content: center; padding: 40px; }
        .checkout-container { background: var(--cor-card); padding: 30px; border-radius: 16px; width: 100%; max-width: 450px; border: 1px solid rgba(0, 255, 136, 0.1); }
        h2 { color: var(--cor-destaque); text-align: center; }
        .campo { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: white; box-sizing: border-box; }
        .flex { display: flex; gap: 10px; }
        .btn-finalizar { width: 100%; padding: 15px; background: var(--cor-destaque); color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn-finalizar:hover { transform: scale(1.02); box-shadow: 0 0 15px var(--cor-destaque); }
    </style>
</head>
<body>

<div class="checkout-container">
    <div style="margin-bottom: 25px; display: flex; gap: 10px;">
    <button type="button" id="btnCartao" onclick="setMetodo('cartao')" style="flex:1; padding: 10px; cursor:pointer; background: #222; color: white; border: 1px solid #333; border-radius: 8px;">💳 Cartão</button>
    <button type="button" id="btnPix" onclick="setMetodo('pix')" style="flex:1; padding: 10px; cursor:pointer; background: #222; color: white; border: 1px solid #333; border-radius: 8px;">💠 PIX</button>
</div>

<!-- Área do PIX (fica escondida até clicar) -->
<div id="areaPix" style="display: none; text-align: center; background: #0a0a0a; padding: 20px; border-radius: 12px; border: 1px dashed var(--cor-destaque);">
    <p style="font-size: 0.9rem; color: #888;"><strong style="color: white;"></strong></p>
    
    <!-- Link que "chama" o aplicativo do banco -->
    <a href="https://nubank.com.br/pagar/61983180655/valor-vape" id="linkBanco" class="btn-finalizar" style="text-decoration: none; display: block; background: #00ff88; color: black; margin-top: 15px;">
        PAGAR AGORA NO BANCO
    </a>
    
    <p style="font-size: 0.7rem; margin-top: 10px; color: #555;">Após pagar, você será redirecionado automaticamente.</p>
</div>
    <h2>Finalizar Pagamento</h2>
    <div style="background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333;">
    <p style="margin: 0; color: #888; font-size: 0.8rem;">Você está comprando:</p>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
        <strong id="nomeProdutoDinamico" style="font-size: 1.1rem;" ></strong>
        <strong id="valorDinamico" style="color: #00ff88; font-size: 1.2rem;"></strong>
    </div>
</div>
    <form id="formPagamento">
        <div class="campo">
            <label>Nome Impresso no Cartão</label>
            <input type="text" id="nomeCartao" placeholder="Ex: JOÃO SILVA" required>
        </div>
        <div class="campo">
            <label>Número do Cartão</label>
            <input type="text" id="numCartao" placeholder="0000 0000 0000 0000" required>
        </div>
        <div class="flex">
            <div class="campo">
                <label>Validade</label>
                <input type="text" id="validade" placeholder="MM/AA" required>
            </div>
            <div class="campo">
                <label>CVV</label>
                <input type="text" id="cvv" placeholder="123" required>
            </div>
        </div>
        <button type="submit" class="btn-finalizar">CONFIRMAR PAGAMENTO</button>
    </form>
</div>

<script>
    document.getElementById('formPagamento').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Dados que podemos salvar com segurança
        const dadosPedido = {
            cliente: localStorage.getItem('emailLogado'),
            nomeNoCartao: document.getElementById('nomeCartao').value,
            dataPedido: new Date().toLocaleString(),
            status: "Pendente de Envio"
        };

        // Salvando o pedido na "caixa de saída" do navegador
        localStorage.setItem('ultimoPedido', JSON.stringify(dadosPedido));

        alert('Pagamento processado com sucesso! Um e-mail de confirmação será enviado.');
        window.location.href = 'sucesso.html';
    });
    function setMetodo(metodo) {
    const formCartao = document.getElementById('formPagamento');
    const areaPix = document.getElementById('areaPix');
    const btnC = document.getElementById('btnCartao');
    const btnP = document.getElementById('btnPix');

    if (metodo === 'pix') {
        formCartao.style.display = 'none';
        areaPix.style.display = 'block';
        btnP.style.border = '1px solid #00ff88';
        btnC.style.border = '1px solid #333';
        
        // Simulação: Ao clicar no link do banco, esperamos 3 segundos e mandamos para Sucesso
        document.getElementById('linkBanco').addEventListener('click', function() {
            setTimeout(() => {
                window.location.href = 'sucesso.html';
            }, 3000); 
        });
    } else {
        formCartao.style.display = 'block';
        areaPix.style.display = 'none';
        btnC.style.border = '1px solid #00ff88';
        btnP.style.border = '1px solid #333';
    }
}

    // 1. Pega os dados da URL (ex: ?produto=Vape&preco=150.00)
    const urlParams = new URLSearchParams(window.location.search);
    const nomeProduto = urlParams.get('produto') || "Produto";
    const precoProduto = urlParams.get('preco') || "0.00";

    // 2. Quando a página carregar, atualiza os textos e o link do banco
    window.addEventListener('load', () => {
        // Atualiza o título ou resumo se você tiver um campo de "Total"
        const resumoPreco = document.getElementById('valorDinamico');
        if(resumoPreco) resumoPreco.innerText = `R$ ${precoProduto}`;
        
        // Atualiza o link do banco com o valor exato!
        const linkBanco = document.getElementById('linkBanco');
        if(linkBanco) {
            // Exemplo usando link de pagamento dinâmico
            // Substitua 'seunome' pela sua conta ou link de cobrança
            linkBanco.href = `https://61983180655/sualoja/${precoProduto}`;
        }
    });
</script>
</body>
</html>
